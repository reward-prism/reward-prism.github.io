<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Reward Prism is an open research space for understanding, evaluating, and improving reward signals."
    />
    <meta name="theme-color" content="#0b0b12" />
    <meta property="og:title" content="Reward Prism" />
    <meta
      property="og:description"
      content="Open research for clearer reward signals."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://reward-prism.github.io/" />
    <title>Reward Prism</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <nav aria-label="Site header">
        <a class="wordmark" href="/" aria-label="Reward Prism home">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 3 29 27H3L16 3Z" />
            <path class="beam" d="M1 13h12M19 17l12-5M19 19l12 1M18 21l11 6" />
          </svg>
          <span>Reward Prism</span>
        </a>
      </nav>

      <section class="hero" aria-labelledby="hero-title">
        <div class="copy">
          <p class="eyebrow"><span></span> Open research</p>
          <h1 id="hero-title">See reward<br />in a new light.</h1>
          <p class="intro">
            Reward Prism is a space for understanding, evaluating, and
            improving the signals that shape intelligent systems.
          </p>
          <div class="actions">
            <span class="note">Projects coming soon.</span>
          </div>
        </div>

        <div class="visual" aria-hidden="true">
          <div class="glow"></div>
          <div class="ray ray-in"></div>
          <div class="prism">
            <div class="facet facet-a"></div>
            <div class="facet facet-b"></div>
            <div class="facet facet-c"></div>
          </div>
          <div class="spectrum">
            <i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>Independent. Open. Curious.</p>
      <p>&copy; 2026 Reward Prism</p>
    </footer>
  </body>
</html>
